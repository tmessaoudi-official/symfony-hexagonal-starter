image: php:8.4-cli-alpine

stages:
    - quality
    - test
    - mutation

variables:
    COMPOSER_CACHE_DIR: '$CI_PROJECT_DIR/.composer-cache'
    APP_ENV: test
    APP_SECRET: ci_test_secret
    DATABASE_URL: 'postgresql://app:app@postgres:5432/app_test?serverVersion=16'
    REDIS_URL: 'redis://redis:6379'
    MESSENGER_TRANSPORT_DSN: 'in-memory://'
    MAILER_DSN: 'null://null'
    MAILER_FROM_ADDRESS: 'ci@example.com'
    MAILER_FROM_NAME: 'CI'

# ─── Shared setup ─────────────────────────────────────────────────────────────
.setup: &setup
    before_script:
        - apk add --no-cache git curl unzip libpq-dev icu-dev libzip-dev
        - docker-php-ext-install pdo pdo_pgsql intl zip
        - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        - composer install --prefer-dist --no-progress --no-interaction
    cache:
        key: '$CI_COMMIT_REF_SLUG-composer'
        paths:
            - .composer-cache/
            - vendor/

# ─── Quality stage ────────────────────────────────────────────────────────────
phpstan:
    stage: quality
    <<: *setup
    script:
        - vendor/bin/phpstan analyse --memory-limit=512M

cs-fixer:
    stage: quality
    <<: *setup
    script:
        - vendor/bin/php-cs-fixer fix --allow-risky=yes --dry-run --diff

rector:
    stage: quality
    <<: *setup
    script:
        - vendor/bin/rector process --dry-run

# ─── Test stage ───────────────────────────────────────────────────────────────
tests-unit:
    stage: test
    <<: *setup
    script:
        - vendor/bin/pest --testsuite=Unit --coverage-text

tests-integration:
    stage: test
    <<: *setup
    services:
        - name: postgres:16-alpine
          alias: postgres
          variables:
              POSTGRES_DB: app_test
              POSTGRES_USER: app
              POSTGRES_PASSWORD: app
        - name: redis:7-alpine
          alias: redis
    script:
        - php bin/console doctrine:migrations:migrate --no-interaction
        - vendor/bin/pest --testsuite=Integration

tests-e2e:
    stage: test
    <<: *setup
    services:
        - name: postgres:16-alpine
          alias: postgres
          variables:
              POSTGRES_DB: app_test
              POSTGRES_USER: app
              POSTGRES_PASSWORD: app
    script:
        - php bin/console doctrine:migrations:migrate --no-interaction
        - vendor/bin/behat

# ─── Mutation stage ───────────────────────────────────────────────────────────
mutation:
    stage: mutation
    <<: *setup
    needs:
        - tests-unit
    script:
        - vendor/bin/infection --threads=4 --min-msi=80 --min-covered-msi=85
    allow_failure: false
