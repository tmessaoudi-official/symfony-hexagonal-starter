default:
    suites:
        default:
            contexts:
                - FeatureContext:
                    kernel: '@kernel'
                - Behat\MinkExtension\Context\MinkContext
                - Behatch\Context\RestContext
                - Behatch\Context\JsonContext

    extensions:
        FriendsOfBehat\SymfonyExtension:
            bootstrap: config/bootstrap.php
            kernel:
                class: App\Kernel
                environment: test
                debug: true

        Behat\MinkExtension:
            base_url: 'http://localhost'
            sessions:
                default:
                    symfony: ~

    gherkin:
        filters:
            tags: '~@skip'

    formatters:
        progress: true
