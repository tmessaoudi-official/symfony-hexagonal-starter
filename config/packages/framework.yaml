framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false

    # ─── Session ──────────────────────────────────────────────────────────────
    # Stateless API — sessions disabled.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    # ─── PHP-CSP / CSRF ───────────────────────────────────────────────────────
    # CSRF protection is for form-based apps; APIs use stateless tokens instead.

    # ─── Serializer ───────────────────────────────────────────────────────────
    serializer:
        enable_annotations: true

    # ─── Validation ───────────────────────────────────────────────────────────
    validation:
        email_validation_mode: html5

    # ─── Rate Limiter ─────────────────────────────────────────────────────────
    rate_limiter:
        api_create_user:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'
            lock_factory: lock.factory
            cache_pool: cache.rate_limiter

    # ─── Mailer ───────────────────────────────────────────────────────────────
    mailer:
        dsn: '%env(MAILER_DSN)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
