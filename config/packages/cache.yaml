framework:
    cache:
        # ─── App Cache (default pool) ──────────────────────────────────────────
        # Redis in prod, filesystem in dev, array in test (see the when@ blocks below).
        # The named pools below stay on Redis in dev too (the compose stack runs Redis), so
        # every PHP image needs ext-redis (installed with PIE in docker/app/Dockerfile).
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        pools:
            # ─── Domain-level cache ────────────────────────────────────────────
            cache.users:
                adapter: cache.adapter.redis
                default_lifetime: 3600
                tags: true    # Tag-based invalidation — see docs/patterns/cache-invalidation.md

            # ─── Rate limiter cache ────────────────────────────────────────────
            cache.rate_limiter:
                adapter: cache.adapter.redis

when@dev:
    framework:
        cache:
            app: cache.adapter.filesystem

when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                cache.users:
                    adapter: cache.adapter.array
                cache.rate_limiter:
                    adapter: cache.adapter.array
