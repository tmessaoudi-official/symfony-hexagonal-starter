framework:
    cache:
        # ─── App Cache (default pool) ──────────────────────────────────────────
        # Uses Redis in production; filesystem in dev/test.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        pools:
            # ─── Domain-level cache ────────────────────────────────────────────
            cache.users:
                adapter: cache.adapter.redis
                default_lifetime: 3600
                tags: true    # Tag-based invalidation — see docs/patterns/cache-invalidation.md

            # ─── Rate limiter cache ────────────────────────────────────────────
            cache.rate_limiter:
                adapter: cache.adapter.redis

when@dev:
    framework:
        cache:
            app: cache.adapter.filesystem

when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                cache.users:
                    adapter: cache.adapter.array
                cache.rate_limiter:
                    adapter: cache.adapter.array
