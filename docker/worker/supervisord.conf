[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; ─── Symfony Messenger worker ─────────────────────────────────────────────────
; Consumes messages from the 'async' transport.
; autostart=true: worker starts when supervisord starts.
; autorestart=true: worker restarts if it crashes.
; stopwaitsecs=20: graceful shutdown — wait up to 20s for in-flight messages.
[program:messenger-async]
command=php /app/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
directory=/app
numprocs=2
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
