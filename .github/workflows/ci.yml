name: CI

on:
    push:
        branches: [ main, master ]
    pull_request:
        branches: [ main, master ]

env:
    PHP_VERSION: '8.5'
    # Next PHP: tested in a non-blocking job until php-amqp, pcov and phpredis release stable 8.6 support.
    PHP_NEXT_VERSION: '8.6'

jobs:
    # ─── Quality checks — run in parallel ─────────────────────────────────────
    phpstan:
        name: PHPStan (level 8)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: amqp, redis
                  coverage: none
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Warmup Symfony cache (needed for PHPStan Symfony extension)
              run: APP_ENV=dev php bin/console cache:warmup
              env:
                  DATABASE_URL: 'postgresql://app:app@localhost:5432/app'
                  APP_SECRET: test_secret

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --memory-limit=512M

    cs-fixer:
        name: PHP-CS-Fixer
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: amqp, redis
                  coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Check code style
              run: vendor/bin/php-cs-fixer fix --allow-risky=yes --dry-run --diff

    rector:
        name: Rector (dry-run)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: amqp, redis
                  coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Check for Rector suggestions
              run: vendor/bin/rector process --dry-run

    # ─── Unit tests (no DB needed — pure PHP) ─────────────────────────────────
    tests-unit:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: amqp, redis
                  coverage: pcov

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run unit tests with coverage
              run: vendor/bin/pest --testsuite=Unit --coverage-clover=build/coverage-unit.xml

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: build/coverage-unit.xml
                  flags: unit

    # ─── Integration tests (requires PostgreSQL) ──────────────────────────────
    tests-integration:
        name: Integration Tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:19-alpine
                env:
                    POSTGRES_DB: app_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

            redis:
                image: redis:8.12-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: pcov
                  extensions: pdo, pdo_pgsql, amqp, redis

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run database migrations
              run: php bin/console doctrine:migrations:migrate --no-interaction
              env:
                  APP_ENV: test
                  DATABASE_URL: 'postgresql://app:app@localhost:5432/app_test?serverVersion=19'
                  REDIS_URL: 'redis://localhost:6379'
                  MESSENGER_TRANSPORT_DSN: 'in-memory://'
                  MAILER_DSN: 'null://null'
                  MAILER_FROM_ADDRESS: 'test@example.com'
                  MAILER_FROM_NAME: 'Test'
                  APP_SECRET: test_secret

            # Mapping and migrated schema must agree: otherwise the next migrations:diff
            # generates unrelated changes (renamed indexes, dropped defaults).
            - name: Validate schema against mapping
              run: php bin/console doctrine:schema:validate
              env:
                  APP_ENV: test
                  DATABASE_URL: 'postgresql://app:app@localhost:5432/app_test?serverVersion=19'
                  REDIS_URL: 'redis://localhost:6379'
                  MESSENGER_TRANSPORT_DSN: 'in-memory://'
                  MAILER_DSN: 'null://null'
                  MAILER_FROM_ADDRESS: 'test@example.com'
                  MAILER_FROM_NAME: 'Test'
                  APP_SECRET: test_secret

            # Functional = HTTP-level tests through the kernel (status codes 201/409/422/404);
            # they need the same database, so they run in this job.
            - name: Run integration and functional tests
              run: vendor/bin/pest --testsuite=Integration,Functional
              env:
                  APP_ENV: test
                  DATABASE_URL: 'postgresql://app:app@localhost:5432/app_test?serverVersion=19'
                  REDIS_URL: 'redis://localhost:6379'
                  MESSENGER_TRANSPORT_DSN: 'in-memory://'
                  MAILER_DSN: 'null://null'
                  MAILER_FROM_ADDRESS: 'test@example.com'
                  MAILER_FROM_NAME: 'Test'
                  APP_SECRET: test_secret

    # ─── E2E (Behat) ──────────────────────────────────────────────────────────
    tests-e2e:
        name: E2E Tests (Behat)
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:19-alpine
                env:
                    POSTGRES_DB: app_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: pdo, pdo_pgsql, amqp, redis

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run database migrations
              run: php bin/console doctrine:migrations:migrate --no-interaction
              env:
                  APP_ENV: test
                  DATABASE_URL: 'postgresql://app:app@localhost:5432/app_test?serverVersion=19'
                  MESSENGER_TRANSPORT_DSN: 'in-memory://'
                  MAILER_DSN: 'null://null'
                  MAILER_FROM_ADDRESS: 'test@example.com'
                  MAILER_FROM_NAME: 'Test'
                  APP_SECRET: test_secret

            - name: Run Behat
              run: vendor/bin/behat
              env:
                  APP_ENV: test
                  DATABASE_URL: 'postgresql://app:app@localhost:5432/app_test?serverVersion=19'
                  MESSENGER_TRANSPORT_DSN: 'in-memory://'
                  MAILER_DSN: 'null://null'
                  MAILER_FROM_ADDRESS: 'test@example.com'
                  MAILER_FROM_NAME: 'Test'
                  APP_SECRET: test_secret

    # ─── Mutation testing: one tool per layer ─────────────────────────────────
    # Domain: Infection (drives the PHPUnit-class tests in tests/Unit/Domain).
    # Application: Pest's own mutation testing. Floors come from measured runs (docs/testing.md).
    mutation:
        name: Mutation Testing (Domain = Infection, Application = Pest)
        runs-on: ubuntu-latest
        needs: [ tests-unit ]   # Only run after unit tests pass.
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: amqp, redis
                  coverage: pcov

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Domain mutation testing (Infection, MSI floor in infection.json5)
              run: vendor/bin/infection --threads=4 --no-progress

            - name: Application mutation testing (Pest)
              run: vendor/bin/pest --testsuite=Unit --mutate --class='App\Application' --parallel --min=98

    # ─── Forward compatibility (non-blocking) ─────────────────────────────────
    # PHP 8.6 cannot build ext-amqp, pcov or a stable phpredis yet (no released fix), so this job
    # skips them (its suites use in-memory transports and array caches):
    # it installs without those platform checks and runs the Unit suite.
    # When php-amqp, pcov and phpredis ship stable 8.6 releases, move PHP_VERSION to 8.6 and delete this job.
    php-next:
        name: Next PHP (non-blocking)
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ env.PHP_NEXT_VERSION }}
                  coverage: none
                  tools: composer:v2

            - name: Install dependencies (without ext-amqp and ext-redis)
              run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-amqp --ignore-platform-req=ext-redis --ignore-platform-req=php

            - name: Run unit tests
              run: vendor/bin/pest --testsuite=Unit
