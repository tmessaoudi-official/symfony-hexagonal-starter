# ─── Production compose — minimal, no dev tooling ────────────────────────────
# Deploy with: docker compose -f docker-compose.prod.yml up -d

services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: prod
        environment:
            APP_ENV: prod
            APP_DEBUG: '0'
            DATABASE_URL: '${DATABASE_URL}'
            REDIS_URL: '${REDIS_URL}'
            MESSENGER_TRANSPORT_DSN: '${MESSENGER_TRANSPORT_DSN}'
            MAILER_DSN: '${MAILER_DSN}'
            MAILER_FROM_ADDRESS: '${MAILER_FROM_ADDRESS}'
            MAILER_FROM_NAME: '${MAILER_FROM_NAME}'
            APP_SECRET: '${APP_SECRET}'
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'php-fpm', '-t']
            interval: 30s
            timeout: 5s
            retries: 3

    nginx:
        image: nginx:1.31-alpine
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            # Mount app public/ so nginx can serve static assets directly.
            # In a real prod setup, copy public/ at build time instead.
            - app_public:/app/public:ro
        depends_on:
            - app
        restart: unless-stopped

    worker:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: prod
        command: >
            sh -c "php bin/console messenger:consume async
                   --time-limit=3600
                   --memory-limit=128M
                   --failure-limit=3"
        environment:
            APP_ENV: prod
            DATABASE_URL: '${DATABASE_URL}'
            MESSENGER_TRANSPORT_DSN: '${MESSENGER_TRANSPORT_DSN}'
            MAILER_DSN: '${MAILER_DSN}'
            MAILER_FROM_ADDRESS: '${MAILER_FROM_ADDRESS}'
            MAILER_FROM_NAME: '${MAILER_FROM_NAME}'
            APP_SECRET: '${APP_SECRET}'
        restart: unless-stopped

volumes:
    app_public:
